plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}




def keystoreProperties = new Properties()

android {
    namespace "com.iglcng.app.flutter_igl_cng"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "default"
    productFlavors {
        iglcng {
            resValue "string", "app_name", "समाधान"
            applicationIdSuffix ".unistaliglcng.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_igl",
                    appIconRound: "@mipmap/ic_launcher_igl"
            ]
            def keystorePropertiesFile = rootProject.file('iglcng.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 12
            versionName "1.0.11-IGL"
        }

        pbgplCNG {
            resValue "string", "app_name", "समाधान"
            applicationIdSuffix ".unistalpbgplcng.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/pbgpl_logo",
                    appIconRound: "@mipmap/pbgpl_logo"
            ]
            versionCode 01
            versionName "1.0.0-PBGPL"
        }

        prodMGL {
            resValue "string", "app_name", "CNG Complaint"
            applicationIdSuffix ".unistalmglcng.app"
            manifestPlaceholders = [
                    appIcon: "@mipmap/unistal_logo",
                    appIconRound: "@mipmap/unistal_logo"
            ]
            def keystorePropertiesFile = rootProject.file('mgl.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 07
            versionName "1.0.0-MGL"
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation(platform("com.google.firebase:firebase-bom:33.0.0"))
    implementation "com.otaliastudios:transcoder:0.10.5"
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")

}
