name: flutter_igl_cng
description: "IGL CNG Status Developed By  Unistal"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  provider: ^6.0.5
  equatable: ^2.0.5
  http: ^1.1.0
  shared_preferences: ^2.2.1
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  package_info_plus: ^4.1.0
  device_info_plus: ^8.0.0
  multi_select_flutter: ^4.1.3
  google_maps_flutter: ^2.5.0
  qr_code_scanner: ^1.0.1
  google_maps_polyline: ^1.0.3
  geolocator: ^10.0.1
  geocoding: ^2.1.0
  permission_handler: ^11.0.0
  dotted_border: ^2.1.0
  camera: ^0.10.5+2
  flutter_local_notifications: ^15.1.0
  hive_flutter: ^1.1.0
  intl: ^0.18.1
  dropdown_search: ^5.0.6
  file_picker: ^5.2.11
  mime: ^1.0.4
  textfield_search: ^0.10.0
  path_provider: ^2.1.2
  flutter_image_compress: ^2.1.0
  get_it: ^7.7.0
  firebase_auth: ^4.19.5
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  vibration: ^1.7.7
  audioplayers: ^6.0.0
  syncfusion_flutter_datepicker: ^25.2.4

dependency_overrides:
  meta: ^1.11.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  analyzer: ^6.3.0
  build_runner: ^2.4.6

flutter:

  uses-material-design: true

  assets:
    - assets/


  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 300
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 700

    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Regular.ttf

flutter_icons:
  android: "ic_launcher_igl"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/ic_launcher_igl.png"
  min_sdk_android: 21


module:
  androidX: true



