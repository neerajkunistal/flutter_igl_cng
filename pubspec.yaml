name: flutter_igl_cng
description: "IGL CNG Status Developed By  Unistal"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.16+17

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  provider: ^6.0.5
  equatable: ^2.0.5
  http: ^1.1.0
  shared_preferences: ^2.2.1
  flutter_spinkit: ^5.1.0
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  multi_select_flutter: ^4.1.3
  qr_code_scanner: ^1.0.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.0.0
  dotted_border: ^2.1.0
#  camera: ^0.11.0
  video_player: ^2.9.1
  flutter_local_notifications: ^18.0.1
  hive_flutter: ^1.1.0
  intl: ^0.20.1
  dropdown_search: ^6.0.1
  file_picker: ^8.1.2
  mime: ^2.0.0
  textfield_search: ^0.11.1
  path_provider: ^2.1.4
  flutter_image_compress: ^2.1.0
  get_it: ^8.0.2
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  vibration: ^2.0.1
  audioplayers: ^6.0.0
  video_compress: ^3.1.2
  google_maps_flutter: ^2.6.1
  google_maps_polyline: ^1.0.3
  pdf: ^3.11.1
  open_file: ^3.5.4
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  webview_flutter: ^4.10.0

dependency_overrides:
  meta: ^1.11.0
  file_picker: 8.1.2
  flutter_spinkit: 5.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  hive_generator: ^2.0.1
  analyzer: ^6.3.0
  build_runner: ^2.4.6

flutter:

  uses-material-design: true

  assets:
    - assets/


  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 300
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 700

    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Regular.ttf

flutter_icons:
  android: "ic_launcher_igl"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/ic_launcher_igl.png"
  min_sdk_android: 21


module:
  androidX: true



